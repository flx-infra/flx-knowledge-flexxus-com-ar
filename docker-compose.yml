version: '3.6'

services:
  kb-postgres:
    image: pgvector/pgvector:0.8.2-pg18
    networks:
      - kb
    ports:
      - '${KB_DB_PORT:-7004}:5432'
    environment:
      - POSTGRES_DB=${KB_DB_NAME:-flx_knowledge}
      - POSTGRES_USER=${KB_DB_USER:?falta KB_DB_USER}
      - POSTGRES_PASSWORD=${KB_DB_PASSWORD:?falta KB_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - 'kb_pgdata:/var/lib/postgresql'
    deploy:
      placement:
        constraints:
          - "${NODE:?falta NODE, debe ser un worker concreto}"
          - node.role == worker
      resources:
        reservations:
          memory: 256M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?falta LOKI_URL}

  kb-api:
    image: ${KB_IMAGE:-fabreguesm/flx-knowledge}:${KB_TAG:-0.9.2}
    hostname: ${KB_HOSTNAME:-flxknowledge-flexxus-com-ar}
    ports:
      - "${KB_API_PORT:-7003}:8000"
    networks:
      - kb
      - traefik
    environment:
      - DATABASE_URL=postgresql://${KB_DB_USER}:${KB_DB_PASSWORD}@kb-postgres:5432/${KB_DB_NAME:-flx_knowledge}
      - KB_BOOTSTRAP_ADMIN_KEY=${KB_BOOTSTRAP_ADMIN_KEY}
      - KB_PUBLIC_URL=${KB_PUBLIC_URL}
      - KB_CHAT_PROJECTS=${KB_CHAT_PROJECTS}
      - KB_CHAT_ANONYMOUS=${KB_CHAT_ANONYMOUS}
      - KB_CHAT_PROVIDER=${KB_CHAT_PROVIDER:-groq}
      - KB_EMBEDDING_PROVIDER=${KB_EMBEDDING_PROVIDER}
      - KB_LLM_PROVIDER=${KB_LLM_PROVIDER}
      - KB_GROQ_API_KEY=${KB_GROQ_API_KEY}
      - KB_GEMINI_API_KEY=${KB_GEMINI_API_KEY}
    deploy:
      placement:
        constraints:
          - "${NODE:?falta NODE, debe ser un worker concreto}"
          - node.role == worker
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?falta LOKI_URL}

  kb-ui:
    image: ${KB_UI_IMAGE:-fabreguesm/flx-knowledge-ui}:${KB_TAG:-0.9.2}
    ports:
      - "${KB_UI_PORT:-7005}:80"
    networks:
      - kb
      - traefik
    environment:
      - KB_API_URL=http://kb-api:8000
    deploy:
      placement:
        constraints:
          - "${NODE:?falta NODE, debe ser un worker concreto}"
          - node.role == worker
      resources:
        limits:
          memory: 128M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?falta LOKI_URL}

volumes:
  kb_pgdata:
    name: "${SERVICE_NAME:?falta SERVICE_NAME}_pgdata"

networks:
  kb:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-network
