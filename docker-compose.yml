version: '3.6'

services:
  kb-postgres:
    image: pgvector/pgvector:0.8.2-pg18
    command:
      - postgres
      - -c
      - effective_cache_size=1GB
      - -c
      - random_page_cost=1.1
    networks:
      - kb
    ports:
      - '7004:5432'
    environment:
      - POSTGRES_DB=flx_knowledge
      - POSTGRES_USER=${KB_DB_USER}
      - POSTGRES_PASSWORD=${KB_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - 'kb_pgdata:/var/lib/postgresql'
    deploy:
      placement:
        constraints:
          - "${NODE}"
          - node.role == worker
      resources:
        reservations:
          memory: 256M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

  kb-api:
    # El tag lo mueve el pipeline. `KB_IMAGE_TAG` clava una versión para un
    # rollback. Al redesplegar hay que tildar "Re-pull image": ver DEPLOY.md.
    image: fabreguesm/flx-knowledge:${KB_IMAGE_TAG:-latest}
    hostname: flxknowledge-flexxus-com-ar
    ports:
      - "7003:8000"
    networks:
      - kb
      - traefik
    # Sólo lo que el panel de configuración NO puede manejar. El resto —chat,
    # proveedores y API keys— se carga desde Configuración › Servicio y hay que
    # cargarlo ANTES de aplicar este stack: ver DEPLOY.md.
    environment:
      - DATABASE_URL=postgresql://${KB_DB_USER}:${KB_DB_PASSWORD}@kb-postgres:5432/${KB_DB_NAME:-flx_knowledge}
      - KB_BOOTSTRAP_ADMIN_KEY=${KB_BOOTSTRAP_ADMIN_KEY}
      - KB_PUBLIC_URL=${KB_PUBLIC_URL}
      - KB_EMBEDDING_PROVIDER=${KB_EMBEDDING_PROVIDER}
    deploy:
      placement:
        constraints:
          - "${NODE}"
          - node.role == worker
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

  kb-ui:
    # La misma variable que kb-api: las dos salen del mismo commit y el contrato
    # SSE lo definen entre ellas.
    image: fabreguesm/flx-knowledge-ui:${KB_IMAGE_TAG:-latest}
    ports:
      - "7005:80"
    networks:
      - kb
      - traefik
    environment:
      - KB_API_URL=http://kb-api:8000
    deploy:
      placement:
        constraints:
          - "${NODE}"
          - node.role == worker
      resources:
        limits:
          memory: 128M
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

volumes:
  kb_pgdata:
    name: "${SERVICE_NAME}_pgdata"

networks:
  kb:
    driver: overlay
    attachable: true
  traefik:
    external: true
    name: traefik-network
